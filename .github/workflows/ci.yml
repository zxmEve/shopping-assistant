name: ProcurePilot CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - "README.md"
      - "Makefile"
      - "compose.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - "README.md"
      - "Makefile"
      - "compose.yaml"
      - ".github/workflows/ci.yml"

jobs:
  backend-and-evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run procure-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procure-pilot-eval-report
          path: backend/evals/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
